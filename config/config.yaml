# Food Detection & Nutrition System Configuration

# ArUco Marker Settings (for size reference)
aruco:
  dictionary: "DICT_4X4_50"  # ArUco dictionary type
  marker_size_cm: 5.0  # Physical size of the ArUco marker in cm
  detection_parameters:
    adaptive_thresh_constant: 7
    min_marker_perimeter_rate: 0.03
    max_marker_perimeter_rate: 4.0

# YOLOv8 Food Detection Settings
yolo:
  model_path: "models/yolov8n.pt"  # Use yolov8n for speed, yolov8x for accuracy
  confidence_threshold: 0.5
  iou_threshold: 0.45
  device: "auto"  # auto, cpu, cuda
  classes: null  # null = all classes, or list specific food classes

# Google Gemini API Settings
gemini:
  model: "gemini-1.5-flash"  # or gemini-1.5-pro for better accuracy
  temperature: 0.3
  max_tokens: 2048
  
# Image Processing
image:
  max_size: 1280  # Max dimension for processing
  supported_formats: ["jpg", "jpeg", "png", "webp"]

# API Settings
api:
  host: "0.0.0.0"
  port: 8000
  cors_origins: ["*"]
  max_file_size_mb: 10

# Logging
logging:
  level: "INFO"
  format: "{time:YYYY-MM-DD HH:mm:ss} | {level} | {message}"
